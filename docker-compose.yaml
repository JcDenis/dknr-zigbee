# Zigbee2MQTT and DKNR Zigbee
#
# Required the following environement variables:
# - DKNR_USERNAME
# - DKNR_PASSWORD
# - DKNR_SECRET
#
# Zigbee2MQTT and DKNR Zigbee must use the same MQTT server:
# set it in Zigbee2MQTT data/configuration.yaml (mqtt: server) and in DKNR Zigbee "Configurer" page.
# DKNR Zigbee: http://<docker host>, Zigbee2MQTT web interface: http://<docker host>:1880
#
name: DKNRZigbee

services:
  zigbee:
    container_name: zigbee
    image: koenkk/zigbee2mqtt:latest
    restart: unless-stopped
    volumes:
      - data:/app/data
      - /run/udev:/run/udev:ro
    ports:
      - 1880:8080
    environment:
      - TZ=Europe/Paris
    devices:
      - /dev/ttyUSB0
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  dknr_zigbee:
    container_name: dknr_zigbee
    image: jcpd/dknr-zigbee:latest
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    environment:
      TZ: Europe/Paris
      DKNR_USERNAME: ${DKNR_USERNAME}
      DKNR_PASSWORD: ${DKNR_PASSWORD}
      DKNR_SECRET: ${DKNR_SECRET}
    ports:
      # change the first port if port 80 is already used on this host
      - 80:1880
    volumes:
      - dknr_zigbee:/data
    healthcheck:
      test: timeout 10s bash -c ':> /dev/tcp/127.0.0.1/1880' || exit 1
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  data:
  dknr_zigbee:
